# =============================================================================
# Render Blueprint for AccessSlot
#
# Deployment strategy:
#   Backend  → Docker Web Service (builds from backend/Dockerfile)
#   Frontend → Static Site (builds with Vite, served via Render CDN)
#   Database → Render managed PostgreSQL (free tier)
#
# IMPORTANT — values marked "sync: false" must be set manually in
# the Render dashboard after the services are created.
# =============================================================================

databases:
  - name: accessslot-db
    databaseName: accessslot_db
    user: accessslot_user
    plan: free
    region: oregon

services:

  # ── Backend: Docker Web Service ───────────────────────────────────────────
  - type: web
    name: accessslot-backend
    runtime: docker
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        # After deploy, add your actual Render hostname here.
        # Format: accessslot-backend.onrender.com,localhost,127.0.0.1
        value: accessslot-backend.onrender.com,localhost,127.0.0.1
      - key: DB_NAME
        fromDatabase:
          name: accessslot-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: accessslot-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: accessslot-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: accessslot-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: accessslot-db
          property: port
      - key: JWT_ACCESS_TOKEN_LIFETIME
        value: "60"
      - key: JWT_REFRESH_TOKEN_LIFETIME
        value: "1440"
      - key: SECURE_SSL_REDIRECT
        # Must be False — Render terminates TLS at the proxy layer.
        # Setting True would cause redirect loops.
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        # Set this AFTER the frontend is deployed.
        # Value: https://accessslot-frontend.onrender.com
        sync: false

  # ── Frontend: Static Site ─────────────────────────────────────────────────
  # Render builds the Vite app and serves the dist/ folder via its global CDN.
  # This is preferred over a Docker container for a static site:
  #   - Free tier
  #   - Global CDN edge delivery
  #   - Automatic HTTPS
  #   - Zero container overhead
  - type: web
    name: accessslot-frontend
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_BASE_URL
        # Set this to your backend URL BEFORE the first deploy.
        # Value: https://accessslot-backend.onrender.com/api
        sync: false
