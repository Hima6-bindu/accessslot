name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Tests (Python 3.11, PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: accessslot_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt

    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Django system check
      working-directory: ./backend
      env:
        DJANGO_SETTINGS_MODULE: accessslot.settings_postgresql
        SECRET_KEY: ci-test-secret-key-not-for-production-use-only
        DEBUG: 'False'
        ALLOWED_HOSTS: localhost,127.0.0.1
        DB_NAME: accessslot_db_test
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_HOST: localhost
        DB_PORT: 5432
        JWT_ACCESS_TOKEN_LIFETIME: 60
        JWT_REFRESH_TOKEN_LIFETIME: 1440
        CORS_ALLOWED_ORIGINS: http://localhost:3000
      run: python manage.py check

    - name: Run migrations
      working-directory: ./backend
      env:
        DJANGO_SETTINGS_MODULE: accessslot.settings_postgresql
        SECRET_KEY: ci-test-secret-key-not-for-production-use-only
        DEBUG: 'False'
        ALLOWED_HOSTS: localhost,127.0.0.1
        DB_NAME: accessslot_db_test
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_HOST: localhost
        DB_PORT: 5432
        JWT_ACCESS_TOKEN_LIFETIME: 60
        JWT_REFRESH_TOKEN_LIFETIME: 1440
        CORS_ALLOWED_ORIGINS: http://localhost:3000
      run: python manage.py migrate --noinput

    - name: Run tests with pytest
      working-directory: ./backend
      env:
        DJANGO_SETTINGS_MODULE: accessslot.settings_postgresql
        SECRET_KEY: ci-test-secret-key-not-for-production-use-only
        DEBUG: 'False'
        ALLOWED_HOSTS: localhost,127.0.0.1
        DB_NAME: accessslot_db_test
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_HOST: localhost
        DB_PORT: 5432
        JWT_ACCESS_TOKEN_LIFETIME: 60
        JWT_REFRESH_TOKEN_LIFETIME: 1440
        CORS_ALLOWED_ORIGINS: http://localhost:3000
      run: pytest --tb=short -v

  frontend-build:
    name: Frontend Build (Node.js 18)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Build production bundle
      working-directory: ./frontend
      run: npm run build

    - name: Check build output
      working-directory: ./frontend
      run: |
        if [ ! -d "dist" ]; then
          echo "Error: dist directory not created"
          exit 1
        fi
        if [ ! -f "dist/index.html" ]; then
          echo "Error: index.html not found in dist"
          exit 1
        fi
        echo "Build successful - dist directory created with index.html"
